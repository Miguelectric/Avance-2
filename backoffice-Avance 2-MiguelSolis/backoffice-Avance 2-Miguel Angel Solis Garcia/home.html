<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backoffice - Home</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body onload="protectPage(); loadProjects();">

    <div class="container">

        <h1>Panel de Proyectos</h1>

        <button onclick="logoutUser()" class="danger">Cerrar Sesión</button>

        <h2>Agregar Proyecto</h2>

        <form class="form" onsubmit="createProjectForm(event)">
            <label>Título:</label>
            <input type="text" id="title" required>

            <label>Descripción:</label>
            <textarea id="description" required></textarea>

            <label>Tecnologías (separadas por coma):</label>
            <input type="text" id="technologies">

            <label>Repositorio (URL):</label>
            <input type="text" id="repository">

            <button type="submit">Crear Proyecto</button>
        </form>

        <h2>Proyectos Registrados</h2>

        <div id="projects"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
